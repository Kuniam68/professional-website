
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Welcome to our professional website. Explore our services, projects, articles and more.">

    <title>My Professional Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
<header class="site-header">
    <a href="index.html?v=5" class="logo">MyWebsite</a>

    <button class="menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="primary-navigation">
        ☰
    </button>

    <nav class="main-nav" id="primary-navigation" aria-label="Main navigation">

        <a href="index.html?v=5" class="active" aria-current="page">Home</a>

        <a href="about.html?v=5">About</a>

        <div class="nav-dropdown">
            <div class="nav-dropdown-heading">
                <a href="services.html?v=5">Services</a>

                <button class="dropdown-toggle"
                    type="button"
                    aria-label="Open Services submenu"
                    aria-expanded="false"
                    aria-controls="services-dropdown">
                    ▾
                </button>
            </div>

            <div class="dropdown-menu" id="services-dropdown">
                <a href="services.html?v=5#web-development">Web Development</a>
                <a href="services.html?v=5#creative-design">Creative Design</a>
                <a href="services.html?v=5#digital-solutions">Digital Solutions</a>
            </div>
        </div>

        <a href="projects.html?v=5">Projects</a>
        <a href="blog.html?v=5">Blog</a>
        <a href="contact.html?v=5">Contact</a>

    </nav>
</header>


    <main>

        <section class="hero">
            <p>WELCOME TO OUR WEBSITE</p>

            <h1>Build Something Extraordinary.</h1>

            <p>
                Discover our work, explore our services
                and learn more about what we do.
            </p>

            <a href="about.html" class="hero-button">
                Discover More
            </a>
        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>

<script>
const menuToggle = document.querySelector(".menu-toggle");
const mainNav = document.querySelector(".main-nav");

menuToggle.addEventListener("click", function() {
    const isExpanded = menuToggle.getAttribute("aria-expanded") === "true";

    menuToggle.setAttribute("aria-expanded", !isExpanded);

    menuToggle.setAttribute(
        "aria-label",
        isExpanded ? "Open navigation menu" : "Close navigation menu"
    );

    mainNav.classList.toggle("active");
});
</script>
</body>
</html>
