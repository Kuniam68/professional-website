
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Learn more about our website, our vision and our mission.">

    <title>About Us | MyWebsite</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
<header class="site-header">
    <a href="index.html" class="logo">MyWebsite</a>

    <button class="menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="primary-navigation">
        ☰
    </button>

    <nav class="main-nav" id="primary-navigation" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html" class="active" aria-current="page">About</a>
        <a href="services.html">Services</a>
        <a href="projects.html">Projects</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

    <main>

        <section class="hero">
            <p>GET TO KNOW US</p>

            <h1>About Our Website</h1>

            <p>
                Discover our story, our vision
                and what makes us different.
            </p>

            <a href="index.html" class="hero-button">
                Back to Home
            </a>
        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>


<script>
const menuToggle = document.querySelector(".menu-toggle");
const mainNav = document.querySelector(".main-nav");

menuToggle.addEventListener("click", function() {
    const isExpanded = menuToggle.getAttribute("aria-expanded") === "true";

    menuToggle.setAttribute("aria-expanded", !isExpanded);

    menuToggle.setAttribute(
        "aria-label",
        isExpanded ? "Open navigation menu" : "Close navigation menu"
    );

    mainNav.classList.toggle("active");
});
</script>

</body>
</html>
